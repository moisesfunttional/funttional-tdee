<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora TDEE - FUNTTIONAL</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { color: #0b5394; }
    form { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; }
    label { display: block; margin: 10px 0 5px; }
    select, input { width: 100%; padding: 8px; margin-bottom: 15px; }
    button { background: #0b5394; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    .result { background: #d9ead3; padding: 15px; margin-top: 20px; border-radius: 8px; }
  </style>
</head>
<body>

<h1>Calculadora de Gasto Calórico Diário (TDEE) - FUNTTIONAL</h1>

<form id="tdeeForm">
  <label>Sexo:</label>
  <select id="sexo" required>
    <option value="">Selecione</option>
    <option value="masculino">Masculino</option>
    <option value="feminino">Feminino</option>
  </select>

  <label>Idade (anos):</label>
  <input type="number" id="idade" required>

  <label>Peso (kg):</label>
  <input type="number" id="peso" required>

  <label>Altura (cm):</label>
  <input type="number" id="altura" required>

  <label>Nível de Atividade Física:</label>
  <select id="atividade" required>
    <option value="">Selecione</option>
    <option value="1.2">Sedentário</option>
    <option value="1.375">Levemente ativo</option>
    <option value="1.55">Moderadamente ativo</option>
    <option value="1.725">Altamente ativo</option>
    <option value="1.9">Extremamente ativo</option>
  </select>

  <label>Objetivo:</label>
  <select id="objetivo" required>
    <option value="">Selecione</option>
    <option value="manter">Manter peso</option>
    <option value="perder">Perder gordura</option>
    <option value="ganhar">Ganhar massa muscular</option>
  </select>

  <button type="button" onclick="calcularTDEE()">Calcular</button>
</form>

<div id="resultado" class="result" style="display:none;"></div>

<script>
function calcularTDEE() {
  const sexo = document.getElementById('sexo').value;
  const idade = parseInt(document.getElementById('idade').value);
  const peso = parseFloat(document.getElementById('peso').value);
  const altura = parseFloat(document.getElementById('altura').value);
  const atividade = parseFloat(document.getElementById('atividade').value);
  const objetivo = document.getElementById('objetivo').value;

  let tmb = (sexo === 'masculino') 
    ? (10 * peso) + (6.25 * altura) - (5 * idade) + 5
    : (10 * peso) + (6.25 * altura) - (5 * idade) - 161;

  let tdee = tmb * atividade;

  let tdeeAjustado = objetivo === 'manter' ? tdee
                  : objetivo === 'perder' ? tdee * 0.85
                  : tdee * 1.15;

  let macros;
  if (objetivo === 'perder') {
    macros = {
      carboidratos: Math.round(0.4 * tdeeAjustado / 4),
      proteinas: Math.round(0.35 * tdeeAjustado / 4),
      gorduras: Math.round(0.25 * tdeeAjustado / 9)
    };
  } else if (objetivo === 'ganhar') {
    macros = {
      carboidratos: Math.round(0.5 * tdeeAjustado / 4),
      proteinas: Math.round(0.3 * tdeeAjustado / 4),
      gorduras: Math.round(0.2 * tdeeAjustado / 9)
    };
  } else {
    macros = {
      carboidratos: Math.round(0.45 * tdeeAjustado / 4),
      proteinas: Math.round(0.3 * tdeeAjustado / 4),
      gorduras: Math.round(0.25 * tdeeAjustado / 9)
    };
  }

  document.getElementById('resultado').style.display = 'block';
  document.getElementById('resultado').innerHTML = `
    <h3>Resultados:</h3>
    <p><strong>TMB estimada:</strong> ${Math.round(tmb)} kcal</p>
    <p><strong>TDEE para manutenção:</strong> ${Math.round(tdee)} kcal</p>
    <p><strong>TDEE ajustado (${objetivo}):</strong> ${Math.round(tdeeAjustado)} kcal</p>
    <h4>Divisão de Macronutrientes:</h4>
    <ul>
      <li>Carboidratos: ${macros.carboidratos}g/dia</li>
      <li>Proteínas: ${macros.proteinas}g/dia</li>
      <li>Gorduras: ${macros.gorduras}g/dia</li>
    </ul>
  `;
}
</script>

</body>
</html>
